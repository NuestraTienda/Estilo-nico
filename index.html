<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EstiloÚnico</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; }

    /* HEADER */
    header { background: #fff; padding: 15px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 100; }
    .header-top { display: flex; align-items: center; gap: 12px; }
    .hamburger { width: 36px; height: 36px; border: none; background: none; cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px; }
    .hamburger span { display: block; width: 22px; height: 2px; background: #333; border-radius: 2px; }
    header h1 { font-size: 1.4rem; color: #222; flex: 1; cursor: pointer; }
    .search-box { display: flex; align-items: center; background: #f0f0f0; border-radius: 20px; padding: 8px 14px; flex: 2; max-width: 300px; }
    .search-box input { border: none; background: none; outline: none; font-size: 0.9rem; width: 100%; }
    .search-box svg { width: 18px; height: 18px; margin-right: 8px; fill: #999; }

    /* SIDEBAR */
    .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100vh; background: #fff; box-shadow: 2px 0 12px rgba(0,0,0,0.15); z-index: 200; transition: left 0.3s; padding: 20px; overflow-y: auto; }
    .sidebar.abierto { left: 0; }
    .sidebar h2 { font-size: 1.1rem; margin-bottom: 16px; }
    .sidebar .seccion { margin-bottom: 20px; }
    .sidebar .seccion h3 { font-size: 0.85rem; text-transform: uppercase; color: #888; margin-bottom: 8px; }
    .sidebar .seccion button { display: block; width: 100%; text-align: left; padding: 10px 12px; border: none; background: none; cursor: pointer; font-size: 0.95rem; border-radius: 8px; }
    .sidebar .seccion button:hover { background: #f0f0f0; }
    .sidebar .seccion button.activo { background: #333; color: #fff; }
    .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 150; display: none; }
    .overlay.visible { display: block; }
    .cerrar-menu { position: absolute; top: 15px; right: 15px; border: none; background: none; font-size: 1.5rem; cursor: pointer; color: #666; }

    /* LOBBY: GRID DE CATEGORÍAS CON IMAGEN GRANDE */
    .grid-categorias { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; padding: 20px; max-width: 1200px; margin: 0 auto; }
    .cat-card { position: relative; border-radius: 14px; overflow: hidden; cursor: pointer; box-shadow: 0 3px 12px rgba(0,0,0,0.1); transition: transform 0.2s; }
    .cat-card:hover { transform: scale(1.03); }
    .cat-card img { width: 100%; height: 280px; object-fit: cover; display: block; }
    .cat-card .cat-label { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,0.7)); color: #fff; padding: 30px 16px 14px; font-size: 1.1rem; font-weight: bold; }

    /* BARRA DE CATEGORÍAS (dentro de una categoría) */
    .barra-cat { display: flex; gap: 8px; padding: 12px 20px; overflow-x: auto; max-width: 1200px; margin: 0 auto; }
    .barra-cat button { padding: 7px 14px; border: 1px solid #ddd; background: #fff; border-radius: 20px; cursor: pointer; font-size: 0.85rem; white-space: nowrap; }
    .barra-cat button.activo { background: #333; color: #fff; border-color: #333; }
    .btn-volver { padding: 10px 16px; border: none; background: #333; color: #fff; border-radius: 8px; cursor: pointer; font-size: 0.9rem; margin: 16px 20px 0; }

    /* GRID DE PRODUCTOS */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; padding: 20px; max-width: 1200px; margin: 0 auto; }
    .card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); transition: transform 0.2s; }
    .card:hover { transform: translateY(-4px); }
    .card img { width: 100%; height: 320px; object-fit: cover; }
    .card-body { padding: 16px; }
    .card-body .tag { font-size: 0.75rem; background: #eee; padding: 3px 8px; border-radius: 10px; display: inline-block; margin-bottom: 6px; }
    .card-body h3 { font-size: 1rem; margin-bottom: 4px; }
    .card-body .desc { font-size: 0.85rem; color: #666; margin-bottom: 10px; }
    .card-body .precio { font-size: 1.2rem; font-weight: bold; color: #222; }
    .card-body .talles { margin: 10px 0; }
    .card-body .talles span { display: inline-block; padding: 4px 10px; margin: 2px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.8rem; cursor: pointer; }
    .card-body .talles span.sel { background: #333; color: #fff; }
    .btn-encargar { display: block; width: 100%; padding: 12px; background: #25D366; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 10px; text-align: center; text-decoration: none; }
    .btn-encargar:active { background: #1da851; }
    .agotado { display: block; width: 100%; padding: 12px; background: #ccc; color: #888; border: none; border-radius: 8px; font-size: 1rem; margin-top: 10px; text-align: center; }
    .sin-resultados { text-align: center; padding: 60px 20px; color: #999; font-size: 1.1rem; grid-column: 1 / -1; }
  </style>
</head>
<body>

  <div class="overlay" id="overlay" onclick="cerrarSidebar()"></div>

  <div class="sidebar" id="sidebar">
    <button class="cerrar-menu" onclick="cerrarSidebar()">&times;</button>
    <h2>Filtrar por talle</h2>
    <div class="seccion">
      <h3>Talle</h3>
      <button data-filtro="talle" data-valor="todos" class="activo" onclick="setFiltroTalle('todos')">Todos</button>
      <button data-filtro="talle" data-valor="XS" onclick="setFiltroTalle('XS')">XS</button>
      <button data-filtro="talle" data-valor="S" onclick="setFiltroTalle('S')">S</button>
      <button data-filtro="talle" data-valor="M" onclick="setFiltroTalle('M')">M</button>
      <button data-filtro="talle" data-valor="L" onclick="setFiltroTalle('L')">L</button>
      <button data-filtro="talle" data-valor="XL" onclick="setFiltroTalle('XL')">XL</button>
      <button data-filtro="talle" data-valor="XXL" onclick="setFiltroTalle('XXL')">XXL</button>
    </div>
  </div>

  <header>
    <div class="header-top">
      <button class="hamburger" onclick="abrirSidebar()">
        <span></span><span></span><span></span>
      </button>
      <h1 onclick="irInicio()">EstiloÚnico</h1>
      <div class="search-box">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
        <input type="text" id="buscador" placeholder="Buscar prenda..." oninput="render()">
      </div>
    </div>
  </header>

  <div id="contenido"></div>

  <script src="data.js"></script>
  <script>
    const WHATSAPP = "5493468542942";
    let filtroCategoria = null;
    let filtroGenero = null;
    let filtroTalle = "todos";

    function abrirSidebar() {
      document.getElementById("sidebar").classList.add("abierto");
      document.getElementById("overlay").classList.add("visible");
    }
    function cerrarSidebar() {
      document.getElementById("sidebar").classList.remove("abierto");
      document.getElementById("overlay").classList.remove("visible");
    }
    function setFiltroTalle(valor) {
      filtroTalle = valor;
      document.querySelectorAll('[data-filtro="talle"]').forEach(b => b.classList.remove("activo"));
      document.querySelector(`[data-filtro="talle"][data-valor="${valor}"]`).classList.add("activo");
      render();
    }
    function irInicio() {
      filtroCategoria = null;
      filtroGenero = null;
      filtroTalle = "todos";
      document.getElementById("buscador").value = "";
      document.querySelectorAll('[data-filtro="talle"]').forEach(b => b.classList.remove("activo"));
      document.querySelector('[data-filtro="talle"][data-valor="todos"]').classList.add("activo");
      render();
    }
    function abrirCategoria(genero, cat) {
      filtroGenero = genero;
      filtroCategoria = cat;
      render();
    }

    function render() {
      const cont = document.getElementById("contenido");
      cont.innerHTML = "";
      const texto = document.getElementById("buscador").value.toLowerCase().trim();

      // === LOBBY: grid de categorías con imagen ===
      if (filtroCategoria === null) {
        let cats = categorias;
        if (texto) {
          cats = categorias.filter(c => {
            const hayEnCat = c.nombre.toLowerCase().includes(texto);
            const hayEnProd = productos.some(p => p.categoria === c.nombre && p.genero === c.genero &&
              (p.nombre.toLowerCase().includes(texto) || p.descripcion.toLowerCase().includes(texto)));
            return hayEnCat || hayEnProd;
          });
        }

        const grid = document.createElement("div");
        grid.className = "grid-categorias";
        cats.forEach(c => {
          const card = document.createElement("div");
          card.className = "cat-card";
          card.onclick = () => abrirCategoria(c.genero, c.nombre);
          card.innerHTML = `
            <img src="${c.imagen}" alt="${c.nombre}" loading="lazy">
            <div class="cat-label">${c.nombre} · ${c.genero.charAt(0).toUpperCase() + c.genero.slice(1)}</div>
          `;
          grid.appendChild(card);
        });
        cont.appendChild(grid);
        return;
      }

      // === VISTA DE CATEGORÍA ===
      const catsDelGenero = categorias.filter(c => c.genero === filtroGenero);

      // Barra superior con las categorías del género
      const barra = document.createElement("div");
      barra.className = "barra-cat";
      catsDelGenero.forEach(c => {
        const btn = document.createElement("button");
        btn.textContent = c.nombre;
        btn.className = filtroCategoria === c.nombre ? "activo" : "";
        btn.onclick = () => { filtroCategoria = c.nombre; render(); };
        barra.appendChild(btn);
      });
      cont.appendChild(barra);

      // Botón volver
      const btnVolver = document.createElement("button");
      btnVolver.className = "btn-volver";
      btnVolver.textContent = "← Volver al inicio";
      btnVolver.onclick = irInicio;
      cont.appendChild(btnVolver);

      // Grid de prendas
      const visibles = productos.filter(p => {
        if (p.genero !== filtroGenero) return false;
        if (p.categoria !== filtroCategoria) return false;
        if (filtroTalle !== "todos" && !p.talles.includes(filtroTalle)) return false;
        if (texto) {
          const hay = p.nombre.toLowerCase().includes(texto) || p.descripcion.toLowerCase().includes(texto);
          if (!hay) return false;
        }
        return true;
      });

      const grid = document.createElement("div");
      grid.className = "grid";

      if (visibles.length === 0) {
        grid.innerHTML = `<p class="sin-resultados">No se encontraron prendas 😕</p>`;
      }

      visibles.forEach((p) => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <img src="${p.imagen}" alt="${p.nombre}" loading="lazy">
          <div class="card-body">
            <h3>${p.nombre}</h3>
            <p class="desc">${p.descripcion}</p>
            <p class="precio">$ ${p.precio.toLocaleString("es-AR")}</p>
            <div class="talles">
              ${p.talles.map(t => `<span data-talle="${t}">${t}</span>`).join("")}
            </div>
            ${p.disponible
              ? `<a class="btn-encargar" href="#" onclick="encargar(${productos.indexOf(p)}, this)">📲 Encargar</a>`
              : `<span class="agotado">Agotado</span>`
            }
          </div>`;
        grid.appendChild(card);

        card.querySelectorAll(".talles span").forEach(sp => {
          sp.onclick = () => {
            card.querySelectorAll(".talles span").forEach(s => s.classList.remove("sel"));
            sp.classList.add("sel");
          };
        });
      });
      cont.appendChild(grid);
    }

    function encargar(idx, btn) {
      const p = productos[idx];
      const cont = btn.previousElementSibling;
      const sel = cont.querySelector(".sel");
      const talle = sel ? sel.textContent : "a definir";
      const msg = `Hola! Quiero encargar:\n${p.nombre}\nTalle: ${talle}\nPrecio: $${p.precio.toLocaleString("es-AR")}`;
      window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`, "_blank");
    }

    render();
  </script>
</body>
</html>
